<meta charset="UTF-8">
<div style="font-family:Arial,sans-serif;max-width:900px;margin:0 auto;padding:24px;background:#111;color:#fff;min-height:100vh;">
  <h2 style="margin-top:0;">💱 Валютный калькулятор</h2>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
    <div style="background:#1f1f1f;padding:20px;border-radius:20px;">
      <label>Сумма в узбекских сумах</label>
      <input id="uzs" type="number" value="455000"
        style="width:100%;box-sizing:border-box;margin:10px 0 18px;padding:14px;font-size:24px;border-radius:14px;border:1px solid #444;background:#222;color:#fff;">

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
        <div>
          <label>Покупка $ за ₽</label>
          <input id="usdRub" type="number" step="0.01" value="86.5"
            style="width:100%;box-sizing:border-box;margin-top:8px;padding:12px;font-size:18px;border-radius:12px;border:1px solid #444;background:#222;color:#fff;">
        </div>

        <div>
          <label>Обмен $ → сум</label>
          <input id="usdUzs" type="number" step="1" value="11770"
            style="width:100%;box-sizing:border-box;margin-top:8px;padding:12px;font-size:18px;border-radius:12px;border:1px solid #444;background:#222;color:#fff;">
        </div>
      </div>
    </div>

    <div style="background:#1f1f1f;padding:20px;border-radius:20px;">
      <div style="color:#bbb;">Стоимость покупки наличными</div>
      <div id="rubResult" style="font-size:38px;font-weight:bold;margin:12px 0 22px;">—</div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
        <div style="border:1px solid #444;padding:14px;border-radius:14px;">
          <div style="color:#bbb;">Нужно долларов</div>
          <div id="usdResult" style="font-size:22px;font-weight:bold;margin-top:8px;">—</div>
        </div>

        <div style="border:1px solid #444;padding:14px;border-radius:14px;">
          <div style="color:#bbb;">1 000 сум</div>
          <div id="thousandResult" style="font-size:22px;font-weight:bold;margin-top:8px;">—</div>
        </div>
      </div>

      <div style="border:1px solid #444;padding:14px;border-radius:14px;margin-top:14px;">
        <div style="color:#bbb;">Эффективный курс</div>
        <div id="effectiveResult" style="font-size:20px;font-weight:bold;margin-top:8px;">—</div>
      </div>
    </div>
  </div>

  <div style="margin-top:20px;background:#1f1f1f;padding:20px;border-radius:20px;">
    <h3 style="margin-top:0;">Дополнительный перевод</h3>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
      <div>
        <label>Доллары → сум</label>
        <input id="usdInput" type="number" value="100"
          style="width:100%;box-sizing:border-box;margin-top:8px;padding:12px;font-size:18px;border-radius:12px;border:1px solid #444;background:#222;color:#fff;">
      </div>

      <div>
        <label>Результат</label>
        <div id="usdToUzs" style="margin-top:8px;padding:14px;background:#222;border-radius:12px;font-size:20px;">—</div>
      </div>
    </div>
  </div>

  <p style="color:#888;margin-top:18px;">
    Курсы можно менять прямо в полях.
  </p>

  <script>
    const uzs = document.getElementById("uzs");
    const usdRub = document.getElementById("usdRub");
    const usdUzs = document.getElementById("usdUzs");
    const usdInput = document.getElementById("usdInput");

    const rubResult = document.getElementById("rubResult");
    const usdResult = document.getElementById("usdResult");
    const thousandResult = document.getElementById("thousandResult");
    const effectiveResult = document.getElementById("effectiveResult");
    const usdToUzs = document.getElementById("usdToUzs");

    function fmt(value, digits = 2) {
      return new Intl.NumberFormat("ru-RU", {
        minimumFractionDigits: digits,
        maximumFractionDigits: digits
      }).format(value);
    }

    function calculate() {
      const uzsAmount = Number(uzs.value) || 0;
      const rubRate = Number(usdRub.value) || 0;
      const uzsRate = Number(usdUzs.value) || 0;
      const usdAmount = Number(usdInput.value) || 0;

      if (rubRate <= 0 || uzsRate <= 0) return;

      const neededUsd = uzsAmount / uzsRate;
      const rubCost = neededUsd * rubRate;
      const thousandRub = (1000 / uzsRate) * rubRate;
      const effective = uzsRate / rubRate;

      rubResult.textContent = fmt(rubCost, 2) + " ₽";
      usdResult.textContent = "$" + fmt(neededUsd, 2);
      thousandResult.textContent = fmt(thousandRub, 2) + " ₽";
      effectiveResult.textContent = "1 ₽ = " + fmt(effective, 2) + " сум";

      usdToUzs.textContent = fmt(usdAmount * uzsRate, 0) + " сум";
    }

    [uzs, usdRub, usdUzs, usdInput].forEach(el => {
      el.addEventListener("input", calculate);
    });

    calculate();
  </script>
</div>
